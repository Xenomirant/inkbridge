[package]
name = "ib-capture"
description = "Inkbridge screen capture: ScreenSource trait, per-OS backends and a fake for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ib-protocol.workspace = true
thiserror.workspace = true
ib-clock.workspace = true

[features]
# Linux Wayland capture (portal + PipeWire). Needs libpipewire-0.3-dev and
# libclang to build; off by default so plain builds need no system packages.
wayland = ["dep:pipewire", "dep:ib-portal", "dep:tracing"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
libc.workspace = true
pipewire = { workspace = true, optional = true }
ib-portal = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ib-clock.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
block2.workspace = true
dispatch2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
] }

[lints]
workspace = true
