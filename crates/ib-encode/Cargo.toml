[package]
name = "ib-encode"
description = "Inkbridge video encoding: VideoEncoder trait, per-OS hardware backends and a fake for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ib-protocol.workspace = true
ib-capture.workspace = true
thiserror.workspace = true
openh264.workspace = true

[features]
# Linux hardware encoding through VA-API (Intel, AMD, and NVIDIA/WSL via
# Mesa). Building it needs libva-dev and libclang-dev.
vaapi = ["dep:bindgen", "dep:pkg-config", "dep:tracing"]

[build-dependencies]
bindgen = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-video-toolbox.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[lints]
workspace = true
