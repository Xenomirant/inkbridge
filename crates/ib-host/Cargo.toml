[package]
name = "ib-host"
description = "Inkbridge desktop host: accepts tablets and injects their pen input (M1: command-line host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "inkbridge-host"
path = "src/main.rs"

[dependencies]
ib-protocol.workspace = true
ib-geometry.workspace = true
ib-inject.workspace = true
ib-transport.workspace = true
ib-session.workspace = true
ib-clock.workspace = true
ib-capture.workspace = true
ib-encode.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
anyhow.workspace = true
directories.workspace = true
qrcode.workspace = true
if-addrs.workspace = true

[dev-dependencies]
openh264.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
