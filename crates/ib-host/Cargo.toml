[package]
name = "ib-host"
description = "Inkbridge desktop host: accepts tablets and injects their pen input (M1: command-line host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "inkbridge-host"
path = "src/main.rs"

[dependencies]
ib-protocol.workspace = true
ib-geometry.workspace = true
ib-inject.workspace = true
ib-transport.workspace = true
ib-session.workspace = true
ib-clock.workspace = true
ib-capture.workspace = true
ib-encode.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
anyhow.workspace = true
directories.workspace = true
qrcode.workspace = true
if-addrs.workspace = true

[features]
default = ["wayland", "vaapi"]
# Linux Wayland desktops (portal + PipeWire). Building it on Linux needs
# libpipewire-0.3-dev and libclang-dev; `--no-default-features` builds an
# X11-only Linux host. No effect on other OSes.
wayland = ["ib-capture/wayland", "ib-inject/wayland", "dep:ib-portal"]
# Linux hardware encoding (needs libva-dev and libclang-dev to build).
vaapi = ["ib-encode/vaapi"]

[dev-dependencies]
openh264.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ib-portal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
