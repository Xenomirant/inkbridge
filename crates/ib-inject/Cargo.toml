[package]
name = "ib-inject"
description = "Inkbridge pen injection: PenSink trait, per-OS backends and a fake for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ib-protocol.workspace = true
ib-geometry.workspace = true
thiserror.workspace = true

[features]
# Linux Wayland pointer fallback through the RemoteDesktop portal.
wayland = ["dep:ib-portal"]

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
ib-portal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
