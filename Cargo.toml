[workspace]
resolver = "3"
members = ["crates/*", "tools/fake-tablet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/inkbridge/inkbridge"
authors = ["Inkbridge contributors"]
publish = false

[workspace.dependencies]
# Internal crates
ib-protocol = { path = "crates/ib-protocol" }
ib-geometry = { path = "crates/ib-geometry" }
ib-capture = { path = "crates/ib-capture" }
ib-transport = { path = "crates/ib-transport" }
ib-session = { path = "crates/ib-session" }
ib-inject = { path = "crates/ib-inject" }
ib-portal = { path = "crates/ib-portal" }
ib-clock = { path = "crates/ib-clock" }
ib-encode = { path = "crates/ib-encode" }

# External crates (versions pinned centrally)
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
proptest = "1"
tracing = "0.1"
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "io-util"] }
bytes = "1"
# QUIC with the `ring` crypto provider: aws-lc-rs would need CMake + NASM on Windows.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
subtle = "2.6"
socket2 = "0.6"
windows = "0.62"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
# Software H.264 (Cisco, BSD-2-Clause), built from source: universal fallback encoder.
openh264 = "0.9.10"
windows-capture = "2.0.1"
# Linux: uinput virtual pen (pure Rust).
evdev = "0.13.2"
# Linux: X11 screen capture (pure-Rust client: shared memory + damage).
x11rb = { version = "0.14", features = ["shm", "damage", "xfixes"] }
libc = "0.2"
# Linux Wayland: xdg-desktop-portal client (pure Rust, D-Bus).
# Linux VA-API encoder: bindings generated from the installed libva headers.
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
pkg-config = "0.3"
# Linux Wayland: PipeWire client (binds libpipewire; feature-gated).
pipewire = "0.10.1"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
# Rust <-> Kotlin/Swift bindings; pre-1.0, so pinned to a minor version (ADR-0001).
uniffi = "=0.32.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
doc_markdown = "allow"
struct_field_names = "allow"
# The `windows` crate takes pointers to locals throughout; `&raw` adds noise, not safety.
borrow_as_ptr = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
