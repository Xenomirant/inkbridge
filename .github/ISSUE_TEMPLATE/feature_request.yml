name: Feature request
description: Suggest something Inkbridge could do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you'd like to do
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
