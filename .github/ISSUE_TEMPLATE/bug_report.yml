name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer
      placeholder: e.g. Windows 11, RTX 4060 / macOS 15, M2 / Ubuntu 26.04, GNOME Wayland
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: Tablet and pen
      placeholder: e.g. Lenovo Tab P12, Android 14, Tab Pen Plus
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: Connection
      options: [Wi-Fi, USB tethering, USB with adb, Not sure]
  - type: input
    id: version
    attributes:
      label: Inkbridge version or commit
      description: The tablet app shows it at the bottom of its home screen.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The desktop app writes inkbridge.log next to its settings; the command-line host prints to
        the terminal (`RUST_LOG=debug` for more).
      render: text
