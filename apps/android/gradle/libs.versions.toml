# All Android-side versions in one place (stable releases only).
[versions]
agp = "9.5.1"
activity = "1.13.0"
camerax = "1.6.2"
zxing = "3.5.4"
jna = "5.19.1"
graphicsCore = "1.0.4"
motionPrediction = "1.0.1"
junit = "4.13.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
graphics-core = { module = "androidx.graphics:graphics-core", version.ref = "graphicsCore" }
motion-prediction = { module = "androidx.input:input-motionprediction", version.ref = "motionPrediction" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
